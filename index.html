        <h1>📧 Email the Energy Regulator</h1>
        <p>Click the button below to open your email client with a pre‑written message.</p>
        <p><strong>You can review and edit the content before sending.</strong></p>
        <a href="mailto:ertsa@nersa.org.za?subject=REF%3A%20Comments%20on%20the%20Consultation%20Paper%20on%20the%20Eskom%20Retail%20Tariff%20Structural%20Adjustment%20%28ERTSA%29%20Application%20for%20Standard%20Tariffs%20for%20the%202027%2F28%20Financial%20Year%2C%20published%202%20September%202026%20%28closing%20date%20for%20comments%3A%202%20October%202026%2C%2016%3A00%29&body=Dear%20Members%20of%20the%20Energy%20Regulator%0D%0A%0D%0A1.%20I%20write%20in%20terms%20of%20the%20public%20participation%20process%20to%20record%20my%20unconditional%20objection%20to%20Eskom%27s%20ERTSA%20application%20for%20the%202027%2F28%20financial%20year%2C%20which%20proposes%20yet%20another%20average%20increase%20of%20approximately%208.8%25%20in%20the%20price%20of%20electricity.%20I%20say%20this%20at%20the%20outset%2C%20clearly%20and%20without%20equivocation%3A%20nothing%20but%20a%20reduction%20in%20the%20price%20of%20electricity%20is%20acceptable.%20Another%20increase%20is%20not%20merely%20undesirable%20-%20it%20is%20unjustifiable%2C%20unaffordable%20and%20unconscionable%20in%20the%20current%20economic%20climate.%0D%0A%0D%0A2.%20Over%20the%20past%20twenty%20years%2C%20the%20price%20of%20electricity%20in%20South%20Africa%20has%20risen%20by%20more%20than%20900%25%20-%20cumulative%20increases%20that%20have%20outpaced%20inflation%20by%20a%20wide%20margin%20and%20dwarfed%20wage%20growth%20for%20ordinary%20workers.%20Every%20single%20year%2C%20South%20Africans%20are%20told%20that%20this%20year%27s%20increase%20is%20the%20last%20one%2C%20or%20the%20minimum%20possible%2C%20or%20somehow%20for%20our%20own%20good.%20Yet%20the%20increases%20never%20stop.%20Even%20the%20Regulator%27s%20most%20recent%20determination%2C%20approving%20an%20average%20increase%20of%208.76%25%20for%202026%2F27%2C%20landed%20on%20consumers%20who%20are%20already%20drowning%2C%20and%20Eskom%20is%20already%20back%20asking%20for%208.8%25%20more.%20Each%20increase%20compounds%20the%20last%2C%20and%20the%20burden%20is%20never%20lifted%20-%20it%20is%20only%20passed%20on.%0D%0A%0D%0A3.%20This%20country%20is%20in%20the%20grip%20of%20a%20cost-of-living%20crisis.%20Food%20prices%2C%20fuel%2C%20municipal%20rates%2C%20transport%20and%20housing%20have%20all%20risen%20relentlessly%2C%20while%20salaries%20and%20wages%20have%20not%20kept%20pace.%20Working%20South%20Africans%20are%20doing%20more%20hours%20for%20less%20real%20money%2C%20and%20every%20cent%20counts.%20Electricity%20is%20not%20a%20luxury%20that%20can%20be%20cut%20from%20a%20budget%20-%20it%20is%20a%20basic%20need%3A%20it%20cooks%20our%20food%2C%20keeps%20medicine%20cold%2C%20lights%20our%20children%27s%20homework%2C%20and%20powers%20the%20small%20enterprises%20that%20employ%20our%20neighbours.%20For%20the%20poor%2C%20who%20spend%20a%20far%20larger%20share%20of%20their%20income%20on%20energy%20and%20who%20buy%20electricity%20through%20prepaid%20metres%2C%20every%20tariff%20increase%20is%20a%20direct%2C%20immediate%20cut%20to%20an%20already%20inadequate%20income.%20When%20the%20price%20of%20electricity%20rises%2C%20it%20is%20not%20Eskom%27s%20shareholders%20who%20feel%20it%20-%20it%20is%20the%20pensioner%20in%20a%20two-room%20house%20in%20winter%2C%20and%20the%20domestic%20worker%20who%20must%20choose%20between%20a%20warm%20meal%20and%20electricity%20for%20the%20week.%20The%20poor%20and%20the%20working%20class%20bear%20the%20brunt%20of%20every%20increase%2C%20and%20they%20can%20bear%20no%20more.%0D%0A%0D%0A4.%20Eskom%27s%20demand%20for%20yet%20another%20increase%20is%20all%20the%20more%20indefensible%20given%20its%20own%20financial%20results.%20Eskom%20has%20now%20recorded%20its%20first%20profit%20since%202017%20-%20R23.9%20billion%20before%20tax%20in%20the%202024%2F25%20financial%20year%20-%20and%20reports%20indicate%20that%20profits%20have%20since%20more%20than%20doubled.%20Eskom%27s%20own%20annual%20results%20attribute%20this%20turnaround%20in%20large%20measure%20to%20tariff%20increases%20already%20granted.%20In%20other%20words%2C%20the%20South%20African%20public%20has%20already%20paid%20for%20Eskom%27s%20recovery%20through%20higher%20prices%2C%20and%20Eskom%20now%20returns%20to%20the%20trough%20asking%20for%20more%2C%20while%20sitting%20on%20record%20profits.%20Those%20profits%20should%20be%20applied%20to%20reducing%20the%20price%20of%20electricity%20and%20easing%20the%20burden%20on%20consumers%20-%20not%20to%20funding%20yet%20another%20round%20of%20increases.%20A%20profitable%20Eskom%20that%20still%20demands%20annual%20hikes%20is%20not%20a%20utility%20in%20need%3B%20it%20is%20a%20monopoly%20that%20has%20learned%20that%20the%20public%20will%20always%20have%20to%20pay.%0D%0A%0D%0A5.%20The%20wider%20cost%20of%20this%20trajectory%20is%20not%20merely%20household%20hardship%20-%20it%20is%20the%20strangling%20of%20the%20South%20African%20economy.%20The%20entire%20economy%20is%20held%20hostage%20by%20the%20high%20cost%20of%20electricity.%20Affordable%2C%20reliable%20energy%20is%20the%20foundation%20on%20which%20every%20factory%2C%20every%20farm%2C%20every%20mine%2C%20every%20call%20centre%20and%20every%20township%20start-up%20depends.%20Our%20manufacturers%20cannot%20compete%20internationally%20while%20absorbing%20energy%20costs%20that%20erode%20their%20margins%20before%20they%20have%20even%20priced%20a%20single%20product.%20Energy-intensive%20industries%20cannot%20expand%2C%20new%20investment%20is%20scared%20away%2C%20and%20the%20jobs%20that%20should%20follow%20never%20materialise.%20South%20Africa%20cannot%20industrialise%20-%20cannot%20re-industrialise%2C%20cannot%20grow%2C%20cannot%20create%20the%20employment%20our%20people%20so%20desperately%20need%20-%20while%20its%20most%20basic%20input%2C%20electricity%2C%20is%20priced%20beyond%20the%20reach%20of%20the%20economy%20that%20must%20use%20it.%20Load-shedding%20crippled%20this%20economy%20for%20years%3B%20the%20price%20of%20electricity%20now%20inflicts%20the%20same%20damage%2C%20more%20quietly%20but%20just%20as%20surely.%0D%0A%0D%0A6.%20I%20therefore%20call%20on%20the%20Energy%20Regulator%20to%3A%0D%0A6.1%20reject%20Eskom%27s%20application%20in%20its%20entirety%2C%20and%20grant%20no%20increase%20whatsoever%3B%0D%0A6.2%20direct%20Eskom%20to%20reduce%20the%20price%20of%20electricity%2C%20using%20its%20record%20profits%2C%20its%20efficiency%20gains%20and%20its%20own%20cost%20reductions%20to%20deliver%20that%20reduction%3B%20and%0D%0A6.3%20honour%20the%20Regulator%27s%20statutory%20mandate%20to%20protect%20the%20interests%20of%20consumers%20and%20the%20public%2C%20rather%20than%20the%20revenue%20ambitions%20of%20a%20monopoly.%0D%0A%0D%0A7.%20Eskom%27s%20obligation%20is%20to%20serve%20the%20people%20of%20South%20Africa%20with%20affordable%20electricity%2C%20not%20to%20extract%20ever%20more%20from%20a%20population%20that%20is%20already%20impoverished%20by%20the%20very%20cost%20of%20living%20that%20electricity%20price%20increases%20keep%20inflating.%20I%20demand%2C%20as%20a%20South%20African%20citizen%20and%20consumer%2C%20that%20this%20application%20be%20refused%20and%20that%20the%20price%20of%20electricity%20be%20reduced.%20Nothing%20less%20is%20acceptable.%0D%0A%0D%0AYours%20faithfully" class="btn" target="_blank">📧 Compose Email</a>
        <p class="note">After clicking, your default email client will open with the message ready.<br>Review, edit if needed, then press <strong>Send</strong>.</p>
